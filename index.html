<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated Login Form</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#050914;color:#fff;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 80%,#102c57 0%,#071326 48%,#030711 100%)}
.stage{position:relative;height:100dvh;min-height:480px;overflow:hidden}
.floor{position:absolute;bottom:8%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#1c9bff,transparent);box-shadow:0 0 24px #168bff}
.bubble{position:absolute;top:28px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:18px;background:#fff;color:#101827;font-weight:700;font-size:13px;opacity:0;z-index:8;white-space:nowrap;box-shadow:0 5px 25px #0008}
.cyclist{position:absolute;width:clamp(210px,34vw,340px);height:auto;object-fit:contain;left:-420px;bottom:9%;filter:drop-shadow(0 10px 12px #0008);will-change:left}
.towGroup{position:absolute;left:110%;bottom:9%;display:flex;align-items:flex-end;gap:0;will-change:left}
.bikeUnit{position:relative;width:clamp(190px,29vw,300px);flex:0 0 auto;line-height:0}
.towBike{display:block;width:100%;height:auto;object-fit:contain;transform:scaleX(-1);filter:drop-shadow(0 10px 12px #0008)}
/* गाँठ साइकिल के पीछे वाले हिस्से और form के कोने पर */
.bikeUnit:after{display:none}
/* One continuous tow-rope overlay. It is positioned from measured bike/form
   coordinates so its first end sits ON the seat-post, not outside the WebP canvas. */
.rope{position:absolute;z-index:4;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.rope svg{display:block;width:100%;height:100%;overflow:visible}
.formWrap{position:relative;z-index:5;width:clamp(270px,36vw,350px);flex-shrink:0;margin-left:clamp(48px,7vw,82px);filter:drop-shadow(0 0 22px #0284c788)}

.panel{border:2px solid #38bdf8;border-radius:22px;padding:8px;background:linear-gradient(145deg,#10213d,#071326);box-shadow:inset 0 0 22px #0284c733,0 0 24px #0284c766}
.form{background:#0d1729;border-radius:15px;padding:clamp(15px,2.5vw,23px)}
h2{text-align:center;margin:0 0 6px;font-size:24px}.sub{text-align:center;color:#9fb2ce;font-size:12px;margin:0 0 15px}
label{display:block;font-size:12px;font-weight:700;margin:11px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #38506d;background:#071326;color:#fff;outline:none}
input:focus{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf833}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#2563eb,#0891b2);color:white;font-weight:900;font-size:15px}
.tgl{text-align:center;color:#aabbd0;font-size:12px;margin-top:13px;cursor:pointer}.tgl b{color:#38bdf8}
.msg{text-align:center;font-size:12px;min-height:16px;margin:9px 0 0}
.status{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font-size:12px;color:#9ccfff;text-align:center;white-space:nowrap}
@media(max-width:650px){.stage{height:100dvh}.towGroup{bottom:9%;align-items:flex-end}.bikeUnit{width:235px}.cyclist{width:235px}.formWrap{width:clamp(230px,52vw,290px);margin-left:55px}.bubble{top:15px;max-width:92%;white-space:normal;text-align:center}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bubble" id="bubble">Wait! I'm going to bring your login form 🚴</div>
  <img class="cyclist" id="cyclist" alt="Cyclist riding from left to right">
  <div class="towGroup" id="towGroup">
    <div class="bikeUnit"><img class="towBike" id="towBike" alt="Cyclist towing the login form"></div>
    <div class="rope" id="towRope" aria-hidden="true">
      <svg id="ropeSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <linearGradient id="cord" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d3a0"/><stop offset=".48" stop-color="#b9854d"/><stop offset="1" stop-color="#70472a"/></linearGradient>
        </defs>
        <path id="ropeShadow" fill="none" stroke="#21170f" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="ropeLine" fill="none" stroke="url(#cord)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="ropeStitch" fill="none" stroke="#f7e2bd" stroke-width=".65" stroke-dasharray="2 4" stroke-linecap="round"/>
        <path id="bikeKnot" fill="none" stroke="#8c5b35" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="formKnot" fill="none" stroke="#8c5b35" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="formWrap">
      <div class="panel"><form class="form" id="loginForm" novalidate>
        <h2 id="formTitle">Welcome Back</h2><p class="sub" id="sub">Please login to your account</p>
        <div id="nameField" hidden><label for="fullName">Full Name</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Enter your full name"></div>
        <label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        <label for="password">Password (minimum 8 characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="current-password" placeholder="At least 8 characters" required>
        <button class="btn" type="submit" id="submitBtn">Sign In</button>
        <div class="tgl" id="toggle">Don't have an account? <b>Create Account</b></div>
        <p class="msg" id="msg" aria-live="polite"></p>
      </form></div>
    </div>
  </div>
  <div class="floor"></div>
  <div class="status" id="status">A little ride… your form is on its way.</div>
</div>
<script>
const frameCount=19, frameUrls=Array.from({length:frameCount},(_,i)=>`assets/cyclist-frames/frame-${String(i).padStart(2,'0')}.webp`);
const preloaded=frameUrls.map(src=>{const im=new Image();im.src=src;return im});
const cyclist=document.getElementById('cyclist'),towBike=document.getElementById('towBike'),group=document.getElementById('towGroup');
const bubble=document.getElementById('bubble'),statusEl=document.getElementById('status'),stage=document.getElementById('stage');
let frame=0,frameTimer=null,runToken=0;
cyclist.src=frameUrls[0];towBike.src=frameUrls[0];
function animateFrames(img,flip=false){
  clearInterval(frameTimer);frame=0;img.src=frameUrls[0];img.style.transform=flip?'scaleX(-1)':'none';
  frameTimer=setInterval(()=>{frame=(frame+1)%frameCount;img.src=frameUrls[frame]},45);
}
function stopFrames(){clearInterval(frameTimer)}
// Measure the visible cyclist canvas and form edge. The WebP has transparent
// padding, so the rope deliberately enters the bike canvas and is layered over it.
function updateRope(){
 const bike=document.querySelector('.bikeUnit'), form=document.querySelector('.formWrap');
 const svg=document.getElementById('ropeSvg');
 if(!bike||!form||!svg||!group.offsetWidth)return;
 const gw=group.clientWidth, gh=group.clientHeight, bw=bike.clientWidth, bh=bike.clientHeight;
 svg.setAttribute('viewBox',`0 0 ${gw} ${gh}`);
 // The bike is mirrored on the return trip. Its seat/seat-post is around 63% of
 // the mirrored image width and 67% down from the top. Start 18px inside canvas.
 const sx=bike.offsetLeft+bw*.63-12;
 const sy=gh-bh+bh*.675;
 // End the rope slightly underneath the form's left border; form layer masks it.
 const ex=form.offsetLeft+8;
 const ey=form.offsetTop+form.offsetHeight*.70;
 const dx=Math.max(30,ex-sx);
 const sag=Math.min(28,Math.max(10,dx*.10));
 const d=`M ${sx} ${sy} C ${sx+dx*.28} ${sy+sag}, ${sx+dx*.62} ${ey+sag}, ${ex} ${ey}`;
 ['ropeShadow','ropeLine','ropeStitch'].forEach(id=>document.getElementById(id).setAttribute('d',d));
 // A compact two-wrap hitch around the seat-post, kept inside the cyclist canvas.
 const knot=`M ${sx-9} ${sy-8} C ${sx-18} ${sy-17}, ${sx-22} ${sy-2}, ${sx-10} ${sy+2} C ${sx+1} ${sy+6}, ${sx+4} ${sy-9}, ${sx-5} ${sy-12} M ${sx-9} ${sy-4} C ${sx-2} ${sy+5}, ${sx+5} ${sy+7}, ${sx+9} ${sy+1}`;
 document.getElementById('bikeKnot').setAttribute('d',knot);
 const fk=`M ${ex-2} ${ey-8} C ${ex-13} ${ey-14}, ${ex-15} ${ey+1}, ${ex-3} ${ey+3} C ${ex+5} ${ey+4}, ${ex+6} ${ey-5}, ${ex-1} ${ey-7}`;
 document.getElementById('formKnot').setAttribute('d',fk);
}
function say(t){bubble.textContent=t;bubble.style.opacity=1}
function hideSay(){bubble.style.opacity=0}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function move(el,from,to,duration,token){
 return new Promise(resolve=>{
  const start=performance.now();
  function tick(now){if(token!==runToken)return resolve();let p=Math.min(1,(now-start)/duration);let eased=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
   el.style.left=(from+(to-from)*eased)+'px';if(p<1)requestAnimationFrame(tick);else resolve();}
  el.style.left=from+'px';requestAnimationFrame(tick);
 });
}
async function play(){
 const token=++runToken;stopFrames();group.style.display='none';cyclist.style.display='block';
 const w=stage.clientWidth, cw=cyclist.getBoundingClientRect().width;
 say("Wait! I'm going to bring your login form 🚴");statusEl.textContent='Cyclist is riding across the screen…';
 animateFrames(cyclist,false);
 await move(cyclist,-cw-30,w+30,4400,token);
 if(token!==runToken)return;cyclist.style.display='none';stopFrames();hideSay();await wait(450);
 group.style.display='flex';const gw=group.getBoundingClientRect().width;updateRope();
 group.style.left=(w+gw+30)+'px';
 say('Here comes your login form! 💪');statusEl.textContent='The cyclist is towing your form from the right…';
 animateFrames(towBike,true);
 const form=group.querySelector('.formWrap');
 // Center the FORM itself, not the combined bicycle + rope + form group.
 const formCenterOffset=form.offsetLeft+form.offsetWidth/2;
 const centeredGroupLeft=(w/2)-formCenterOffset;
 await move(group,w+gw+30,centeredGroupLeft,4800,token);
 if(token!==runToken)return;stopFrames();towBike.src=frameUrls[0];hideSay();statusEl.textContent='Your login form has arrived. Please sign in.';
}
window.addEventListener('load',()=>setTimeout(play,350));
window.addEventListener('resize',()=>{if(group.style.display==='flex')requestAnimationFrame(updateRope)});
let isLogin=true;
document.getElementById('toggle').addEventListener('click',()=>{
 isLogin=!isLogin;document.getElementById('nameField').hidden=isLogin;
 document.getElementById('fullName').required=!isLogin;
 document.getElementById('formTitle').textContent=isLogin?'Welcome Back':'Create Account';
 document.getElementById('sub').textContent=isLogin?'Please login to your account':'Create your free account';
 document.getElementById('submitBtn').textContent=isLogin?'Sign In':'Create Account';
 document.getElementById('toggle').innerHTML=isLogin?"Don't have an account? <b>Create Account</b>":"Already have an account? <b>Sign In</b>";
 document.getElementById('msg').textContent='';
});
document.getElementById('loginForm').addEventListener('submit',e=>{
 e.preventDefault();const name=document.getElementById('fullName'),email=document.getElementById('email'),pass=document.getElementById('password'),msg=document.getElementById('msg');
 msg.style.color='#fb7185';
 if(!isLogin&&!name.value.trim()){name.setCustomValidity('Please enter your full name');name.reportValidity();msg.textContent='Please fill in your name.';return;}else name.setCustomValidity('');
 const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
 if(!email.value.trim()||!emailPattern.test(email.value.trim())){email.setCustomValidity('Enter a valid email address');email.reportValidity();msg.textContent='Please enter a valid email address.';return;}else email.setCustomValidity('');
 if(pass.value.length<8){pass.setCustomValidity('Password must contain at least 8 characters');pass.reportValidity();msg.textContent='Password must be at least 8 characters.';return;}else pass.setCustomValidity('');
 if(!e.target.checkValidity()){e.target.reportValidity();msg.textContent='Please complete all required fields.';return;}
 msg.style.color='#4ade80';msg.textContent='✓ All fields are valid! Demo form submitted.';
});
['fullName','email','password'].forEach(id=>document.getElementById(id).addEventListener('input',e=>e.target.setCustomValidity('')));
</script>
</body></html>
